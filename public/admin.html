<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Question — IB Question Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">IB Question Bank <span>&amp; Markschemes</span></a>
    <nav class="site-nav">
      <a href="/">Browse</a>
      <a href="/admin.html">Add Question</a>
    </nav>
  </header>

  <div class="layout" style="grid-template-columns: 1fr;">
    <div class="panel" style="max-width: 720px; margin: 0 auto; width: 100%;">
      <h3>Import a question from a past paper</h3>
      <form id="question-form">
        <div class="row">
          <div class="field">
            <label for="subject">Subject *</label>
            <input list="subject-options" id="subject" name="subject" required placeholder="e.g. Math AA" />
            <datalist id="subject-options"></datalist>
          </div>
          <div class="field">
            <label for="topic">Topic *</label>
            <input list="topic-options" id="topic" name="topic" required placeholder="e.g. Calculus" />
            <datalist id="topic-options"></datalist>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="subtopic">Subtopic</label>
            <input type="text" id="subtopic" name="subtopic" placeholder="e.g. Differentiation" />
          </div>
          <div class="field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="">Unspecified</option>
              <option>Easy</option>
              <option>Medium</option>
              <option>Hard</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" placeholder="2023" min="1990" max="2100" />
          </div>
          <div class="field">
            <label for="session">Session</label>
            <input type="text" id="session" name="session" placeholder="e.g. May" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="paper">Paper</label>
            <input type="text" id="paper" name="paper" placeholder="e.g. Paper 1" />
          </div>
          <div class="field">
            <label for="question_number">Question number</label>
            <input type="text" id="question_number" name="question_number" placeholder="e.g. 7" />
          </div>
        </div>

        <div class="field">
          <label for="marks">Total marks</label>
          <input type="number" id="marks" name="marks" min="0" style="max-width: 140px;" />
        </div>

        <div class="field">
          <label for="question_text">Question text (optional, if not using an image)</label>
          <textarea id="question_text" name="question_text"></textarea>
        </div>
        <div class="field">
          <label for="question_image">Question image (scan/screenshot of the past paper question)</label>
          <input type="file" id="question_image" name="question_image" accept="image/*" />
        </div>

        <div class="field">
          <label for="markscheme_text">Mark scheme text (optional, if not using an image)</label>
          <textarea id="markscheme_text" name="markscheme_text"></textarea>
        </div>
        <div class="field">
          <label for="markscheme_image">Mark scheme image</label>
          <input type="file" id="markscheme_image" name="markscheme_image" accept="image/*" />
        </div>

        <button type="submit" class="btn">Add question</button>
        <div id="form-msg"></div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
